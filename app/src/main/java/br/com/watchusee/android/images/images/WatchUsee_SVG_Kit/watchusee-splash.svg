      <stop offset="0.72" stop-color="#F5A900"/>
      <stop offset="1" stop-color="#B96A00"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="0.28" stop-color="#FFF7EE" stop-opacity="0.58"/>
      <stop offset="0.68" stop-color="#FFFFFF" stop-opacity="0.32"/>
